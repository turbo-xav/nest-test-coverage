services:
  postgres:
    image: postgres:17-alpine
    container_name: nest-person
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: nest-person
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d nest-person']
      interval: 2s
      timeout: 5s
      retries: 10
